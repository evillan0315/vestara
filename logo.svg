<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 571" width="605" height="571">
  <defs>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="605" height="571" fill="#0A0A0A"/>

  <!-- Left half -->
  <path d="M 200 80 L 185 100 L 155 160 L 125 220 L 100 280 L 85 320 L 100 340 L 130 380 L 165 420 L 200 460 L 240 500 L 280 530 L 295 545 L 299 548 L 300 549
           L 280 549 L 240 510 L 200 470 L 165 430 L 130 390 L 100 350 L 85 310 L 95 280 L 115 230 L 145 170 L 175 110 L 195 90 Z"
        fill="#1A1A1A" stroke="none"/>

  <!-- Right half -->
  <path d="M 405 80 L 420 100 L 450 160 L 480 220 L 505 280 L 520 320 L 505 340 L 475 380 L 440 420 L 405 460 L 365 500 L 325 530 L 310 545 L 306 548 L 305 549
           L 325 549 L 365 510 L 405 470 L 440 430 L 475 390 L 505 350 L 520 310 L 510 280 L 490 230 L 460 170 L 430 110 L 410 90 Z"
        fill="#1A1A1A" stroke="none"/>

  <!-- Left inner edge detail -->
  <path d="M 200 80 L 195 90 L 175 110 L 145 170 L 115 230 L 95 280 L 85 310 L 90 300 L 100 280 L 120 230 L 150 170 L 180 110 L 200 85 Z"
        fill="#222222" stroke="none"/>

  <!-- Right inner edge detail -->
  <path d="M 405 80 L 410 90 L 430 110 L 460 170 L 490 230 L 510 280 L 520 310 L 515 300 L 505 280 L 485 230 L 455 170 L 425 110 L 405 85 Z"
        fill="#222222" stroke="none"/>

  <!-- Gold center seam line -->
  <line x1="302.5" y1="80" x2="302.5" y2="549"
        stroke="url(#goldGlow)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Subtle inner glow line -->
  <line x1="302.5" y1="80" x2="302.5" y2="549"
        stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
</svg>
